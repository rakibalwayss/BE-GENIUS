# BE GENIUS — Ultra-High Concurrency Nginx Configuration
# Optimized for 100,000+ Concurrent Visitors (1 Lakh+ Users)

user nginx;
worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 20000;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High performance network I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    reset_timedout_connection on;

    # Open file cache for fast static serving
    open_file_cache max=50000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip Compression (reduces payload by 70%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    server {
        listen 80;
        server_name begenius.com www.begenius.com;
        root /var/www/be-genius;
        index index.html;

        # Static assets (1 Year Immutable Cache)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Root and SPA client routing
        location / {
            add_header Cache-Control "public, max-age=0, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
